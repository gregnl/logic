<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Logic Visual Cue</title>
    <style>
        body, html { 
            margin: 0; width: 100%; height: 100%; 
            background: #000; display: flex; 
            align-items: center; justify-content: center; 
            overflow: hidden; touch-action: manipulation;
        }
        #screen { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            font-weight: bold; font-size: 15vw; color: #333; 
        }
    </style>
</head>
<body>

    <div id="screen">READY</div>

    <script>
        // Pakt automatisch het juiste IP en poort (192.168.2.63:8080)
        const wsServerUrl = 'ws://' + window.location.host; 
        let ws;

        function connect() {
            ws = new WebSocket(wsServerUrl);
            
            ws.onopen = () => {
                document.getElementById('screen').innerText = "SYNCED";
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                const screen = document.getElementById('screen');
                
                if (data.isDownbeat) {
                    document.body.style.background = "#00FF00"; // Felgroen op de '1'
                    screen.style.color = "#000";
                    screen.innerText = "1";
                } else if (data.triggered) {
                    document.body.style.background = "#FFFFFF"; // Wit voor de tel
                    screen.style.color = "#000";
                    screen.innerText = ".";
                } else {
                    document.body.style.background = "#000000"; // Zwart ertussenin
                    screen.innerText = "";
                }
            };

            ws.onclose = () => {
                document.getElementById('screen').innerText = "RECONNECT...";
                setTimeout(connect, 2000);
            };
        }

        connect();
    </script>
</body>
</html>
